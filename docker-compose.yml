# Nocturna — LAN party host via Docker
# Usage: docker compose up --build
# Phones join via LAN IP — never localhost in QR (see /api/host-info).

services:
  nocturna:
    build:
      context: .
      dockerfile: Dockerfile
    image: nocturna:local
    container_name: nocturna
    ports:
      - "${NOCTURNA_PORT:-3001}:${NOCTURNA_PORT:-3001}"
    environment:
      HOST: "0.0.0.0"
      PORT: "${NOCTURNA_PORT:-3001}"
      # Optional: force advertised join host (LAN IP or public hostname). Never localhost.
      # ADVERTISE_HOST: "192.168.1.20"
      NODE_ENV: production
    restart: unless-stopped
