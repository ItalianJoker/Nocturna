# Nocturna — LAN party host via Docker
# Usage: docker compose up --build
# Then open http://localhost:3001 (or http://<host-lan-ip>:3001 from phones)

services:
  nocturna:
    build:
      context: .
      dockerfile: Dockerfile
    image: nocturna:local
    container_name: nocturna
    ports:
      - "${NOCTURNA_PORT:-3001}:3001"
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      NODE_ENV: production
    restart: unless-stopped
    # Host network alternative (Linux only) for easiest LAN discovery:
    # network_mode: host
